<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">   
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Grid Game</h1>
        <div id="grid"></div>
        <p id="message">Reach the star to win!</p>
        <button id="showButtons">Show</button>
        <h3 id="count">Number of steps : 0</h3>
        <button id="restart">Restart</button>
        <button id="nextLevel">Next Level</button>

        <div class="dpad">
            <button id="up" class="dpad-up hidden">
                <span class="dpad-arrow">⬆</span>
            </button>
            <button id="left" class="dpad-left hidden">
                <span class="dpad-arrow">⬅</span>
            </button>
            <button id="right" class="dpad-right hidden">
                <span class="dpad-arrow">➡</span>
            </button>
            <button id="down" class="dpad-down hidden">
                <span class="dpad-arrow">⬇</span>
            </button>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
